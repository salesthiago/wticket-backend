name: Deploy Frontend to EC2

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Create deployment package
        run: |
          cd dist
          tar -czf frontend-build.tar.gz *

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy build to EC2
        run: |
          scp -i ~/.ssh/deploy_key dist/frontend-build.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/wticket-deploy/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Backup anterior
            sudo rm -rf /var/www/wticket-backup
            if [ -d "/var/www/wticket" ]; then
              sudo mv /var/www/wticket /var/www/wticket-backup
            fi

            # Criar diretório
            sudo mkdir -p /var/www/wticket

            # Extrair nova versão
            cd ~/wticket-deploy
            sudo tar -xzf frontend-build.tar.gz -C /var/www/wticket/

            # Ajustar permissões
            sudo chown -R nginx:nginx /var/www/wticket
            sudo chmod -R 755 /var/www/wticket

            # Recarregar Nginx
            sudo nginx -t && sudo systemctl reload nginx

            # Limpar arquivo temporário
            rm -f ~/wticket-deploy/frontend-build.tar.gz

            echo "✅ Frontend deployed successfully!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Frontend deployment successful!"
          else
            echo "❌ Frontend deployment failed!"
          fi
