name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
      - development
  pull_request:
    types: [closed]
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --production

      - name: Create deployment package
        run: |
          # Criar diretório temporário
          mkdir -p deploy-package

          # Copiar apenas arquivos necessários
          cp -r src deploy-package/
          cp -r node_modules deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/
          cp ecosystem.config.js deploy-package/

          # Criar arquivo .env de exemplo (não incluir o real por segurança)
          cat > deploy-package/.env.example << 'EOF'
          PORT=3000
          MONGO_URI=mongodb://localhost:27017/wticket
          JWT_SECRET=your-secret-here
          JWT_EXPIRES_IN=7d
          FRONTEND_URL=http://your-domain.com
          LOG_LEVEL=info
          EOF

          # Compactar
          cd deploy-package
          tar -czf ../backend-deploy.tar.gz .
          cd ..

          # Exibir tamanho do pacote
          ls -lh backend-deploy.tar.gz

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment package to EC2
        run: |
          scp -i ~/.ssh/deploy_key backend-deploy.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/wticket-deploy/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e  # Parar em caso de erro

            echo "📦 Iniciando deploy do backend..."

            cd ~/wticket-deploy

            # Fazer backup da versão anterior
            if [ -d "backend" ]; then
              echo "🗂️  Fazendo backup da versão anterior..."
              rm -rf backend-backup
              mv backend backend-backup
            fi

            # Extrair nova versão
            echo "📂 Extraindo nova versão..."
            mkdir -p backend
            tar -xzf backend-deploy.tar.gz -C backend/
            cd backend

            # Criar/atualizar arquivo .env
            echo "⚙️  Configurando variáveis de ambiente..."
            cat > .env << 'EOF'
            PORT=3000
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            LOG_LEVEL=info
            EOF

            # Criar diretório de logs
            mkdir -p logs
            mkdir -p tokens

            # Verificar se PM2 está instalado
            if ! command -v pm2 &> /dev/null; then
              echo "📥 Instalando PM2..."
              npm install -g pm2
            fi

            # Parar aplicação anterior (se existir)
            echo "🔄 Reiniciando aplicação com PM2..."
            pm2 delete wticket-backend 2>/dev/null || true

            # Iniciar com PM2
            pm2 start ecosystem.config.js

            # Salvar configuração do PM2
            pm2 save

            # Configurar PM2 para iniciar no boot (caso ainda não esteja)
            pm2 startup systemd -u ${{ secrets.EC2_USER }} --hp /home/${{ secrets.EC2_USER }} 2>/dev/null || true

            # Limpar arquivo temporário
            rm -f ~/wticket-deploy/backend-deploy.tar.gz

            echo "✅ Backend deployed successfully!"
            echo ""
            echo "📊 Status da aplicação:"
            pm2 status
            echo ""
            echo "📋 Últimas linhas do log:"
            pm2 logs wticket-backend --lines 20 --nostream

      - name: Health Check
        run: |
          echo "🏥 Verificando saúde da aplicação..."
          sleep 5

          # Tentar conectar na API (ajuste a porta se necessário)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:3000 || echo "000")

          if [ "$RESPONSE" = "000" ]; then
            echo "⚠️  Não foi possível conectar à aplicação (porta pode estar fechada no firewall)"
          elif [ "$RESPONSE" = "404" ]; then
            echo "✅ Aplicação está rodando (HTTP $RESPONSE)"
          else
            echo "✅ Aplicação respondeu com HTTP $RESPONSE"
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ ========================================="
            echo "✅ BACKEND DEPLOYMENT SUCCESSFUL!"
            echo "✅ ========================================="
            echo "📍 Host: ${{ secrets.EC2_HOST }}"
            echo "🚀 Aplicação rodando na porta 3000"
          else
            echo "❌ ========================================="
            echo "❌ BACKEND DEPLOYMENT FAILED!"
            echo "❌ ========================================="
            exit 1
          fi
